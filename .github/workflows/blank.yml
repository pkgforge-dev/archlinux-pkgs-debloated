name: build & release packages
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 3 1/7 * *"
  workflow_dispatch:
    inputs:
      ONE_PACKAGE:
        description: 'Set to the name of only one package to be built, package name only without -nano or -mini'
        required: false
        default: ''
      FORCE_BUILD:
        description: 'Set to 1 to force building even if version does not match with upstream'
        required: false
        default: '0'
jobs:
  build:
    name: "Build: ${{ matrix.script }} (${{ matrix.arch }})"
    permissions:
      actions: read
      security-events: write
      contents: write
    # llvm and webkit are much faster on blacksmith, everything else stays on
    # the github-hosted runners to keep costs down
    runs-on: ${{ contains(fromJSON('["llvm-mini","llvm-nano","webkit2gtk-4.1-mini"]'), matrix.script) && matrix.blacksmith-runs-on || matrix.runs-on }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        script:
          - llvm-mini
          - llvm-nano
          - libxml2-mini
          - qt6-base-mini
          - gtk3-mini
          - gtk4-mini
          - gdk-pixbuf2-mini
          - librsvg-mini
          - ffmpeg-mini
          - ffmpeg-nano
          - sdl2_image-mini
          - x265-mini
          - opus-mini
          - mesa-mini
          - mesa-nano
          - mangohud-mini
          - icu-mini
          - kiconthemes-mini
          - libdecor-mini
          - intel-media-driver-mini
          - glycin-mini
          - gtk2-mini
          - webkit2gtk-4.1-mini
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            platform: linux/amd64
            runs-on: ubuntu-24.04
            blacksmith-runs-on: blacksmith-8vcpu-ubuntu-2404
          - arch: aarch64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            blacksmith-runs-on: blacksmith-8vcpu-ubuntu-2404-arm
        exclude:
          - arch: aarch64
            script: intel-media-driver-mini
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --cap-add=SYS_ADMIN --security-opt seccomp=unconfined
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up ccache
        if: ${{ github.event.inputs.ONE_PACKAGE == '' || contains(matrix.script, github.event.inputs.ONE_PACKAGE) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ matrix.script }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.script }}-${{ matrix.arch }}-

      - name: prepare container
        if: ${{ github.event.inputs.ONE_PACKAGE == '' || contains(matrix.script, github.event.inputs.ONE_PACKAGE) }}
        run: /bin/sh ./bin/prepare-build

      - name: build package
        if: ${{ github.event.inputs.ONE_PACKAGE == '' || contains(matrix.script, github.event.inputs.ONE_PACKAGE) }}
        env:
          FORCE_BUILD: ${{ github.event.inputs.FORCE_BUILD }}
          ONE_PACKAGE:  ${{ github.event.inputs.ONE_PACKAGE }}
        run: /bin/sh ./bin/build-package ${{ matrix.script }}.sh

      - name: Upload artifact
        if: ${{ github.event.inputs.ONE_PACKAGE == '' || contains(matrix.script, github.event.inputs.ONE_PACKAGE) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('{0}-{1}', matrix.script, matrix.arch) }}
          path: "dist"

  # foreign arches run through qemu user emulation, only the packages that
  # are confirmed to build are part of the matrix for now
  build-emulated:
    name: "Build: ${{ matrix.script }} (${{ matrix.arch }})"
    permissions:
      actions: read
      security-events: write
      contents: write
    runs-on: blacksmith-16vcpu-ubuntu-2404
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        script:
          - icu-mini
          - libxml2-mini
          - opus-mini
        arch: [riscv64, loongarch64, ppc64le, ppc64]
        include:
          - { arch: riscv64, platform: linux/riscv64 }
          - { arch: loongarch64, platform: linux/loong64 }
          - { arch: ppc64le, platform: linux/ppc64le }
          - { arch: ppc64, platform: linux/ppc64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up qemu
        if: ${{ github.event.inputs.ONE_PACKAGE == '' || contains(matrix.script, github.event.inputs.ONE_PACKAGE) }}
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: build package
        if: ${{ github.event.inputs.ONE_PACKAGE == '' || contains(matrix.script, github.event.inputs.ONE_PACKAGE) }}
        env:
          FORCE_BUILD: ${{ github.event.inputs.FORCE_BUILD }}
          ONE_PACKAGE: ${{ github.event.inputs.ONE_PACKAGE }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            --cap-add=SYS_ADMIN --security-opt seccomp=unconfined \
            -e CCACHE_DIR=/repo/.ccache -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_SLOPPINESS='time_macros,file_macro,include_file_mtime,include_file_ctime' \
            -e FORCE_BUILD="$FORCE_BUILD" -e ONE_PACKAGE="$ONE_PACKAGE" \
            -v "$PWD":/repo -w /repo \
            ghcr.io/pkgforge-dev/archlinux:latest \
            /bin/sh -euc '/bin/sh ./bin/prepare-build && /bin/sh ./bin/build-package ${{ matrix.script }}.sh'

      - name: Upload artifact
        if: ${{ github.event.inputs.ONE_PACKAGE == '' || contains(matrix.script, github.event.inputs.ONE_PACKAGE) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('{0}-{1}', matrix.script, matrix.arch) }}
          path: "dist"

  release:
    name: "release"
    if: ${{ github.ref_name == 'main' }}
    needs: [build, build-emulated]
    permissions:
      actions: read
      security-events: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          merge-multiple: true

      - name: release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          name: "Continuous build"
          tag_name: continuous
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            *.pkg.tar.zst
            *.pkg.tar.xz
