---
name: build builder image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-builder-image.yml
  schedule:
    - cron: "0 1 1/7 * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "Image: ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, runs-on: ubuntu-24.04 }
          - { arch: aarch64, platform: linux/arm64, runs-on: ubuntu-24.04-arm }
          - { arch: riscv64, platform: linux/riscv64, runs-on: ubuntu-24.04 }
          - { arch: loongarch64, platform: linux/loong64, runs-on: ubuntu-24.04 }
          - { arch: ppc64le, platform: linux/ppc64le, runs-on: ubuntu-24.04 }
          - { arch: ppc64, platform: linux/ppc64, runs-on: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up qemu
        if: ${{ matrix.arch != 'x86_64' && matrix.arch != 'aarch64' }}
        run: |
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            sudo modprobe binfmt_misc || true
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          sudo systemctl restart systemd-binfmt 2>/dev/null || sudo /usr/lib/systemd/systemd-binfmt 2>/dev/null || true
          grep -q enabled "/proc/sys/fs/binfmt_misc/qemu-${{ matrix.arch }}"

      # the stock docker driver on the ubuntu runners cannot export the build
      # cache (`cache export not supported for docker driver`); the
      # docker-container driver created here can, so registry cache works
      - name: set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: login to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/archlinux-builder:${{ matrix.arch }}
          # force the `pacman -Syu` layer to actually re-run, otherwise BuildKit
          # reuses it from cache and the baked package database goes stale
          # (https://github.com/pkgforge-dev/archlinux-pkgs-debloated/actions/runs/35068577544)
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/archlinux-builder:cache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/archlinux-builder:cache-${{ matrix.arch }},mode=max
